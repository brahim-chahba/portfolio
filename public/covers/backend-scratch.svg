<g transform="translate(405 115)"><rect width="390" height="420" rx="12" fill="#0d1c34" stroke="#f5f1e8" stroke-width="3"/><rect x="28" y="30" width="334" height="62" rx="6" fill="#1768ff"/><text x="50" y="69" fill="#fff" font-family="monospace" font-size="17" letter-spacing="2">TCP / 8080 / LISTEN</text><path d="M45 145h150M45 185h265M45 225h210M45 265h290" stroke="#91aff0" stroke-width="10"/><path d="M45 325h70l22-38 38 76 40-120 42 82h88" fill="none" stroke="#f5f1e8" stroke-width="5"/></g>
