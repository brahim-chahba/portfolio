<g font-family="monospace" font-size="14" letter-spacing="2"><text x="72" y="195" fill="#8fb1eb">REQUEST BYTES</text><text x="872" y="195" fill="#8fb1eb">ROUTE + HANDLE</text><text x="72" y="380" fill="#f5f1e8">RESPONSE BYTES</text><text x="872" y="380" fill="#f5f1e8">HTTP / 1.1 200</text></g>
<text x="54" y="66" fill="#f5f1e8" font-family="monospace" font-size="18" letter-spacing="4">BACKEND / FIRST PRINCIPLES</text><text x="54" y="620" fill="#91aff0" font-family="monospace" font-size="14" letter-spacing="2">SOCKET → PARSER → ROUTER → RESPONSE</text>
