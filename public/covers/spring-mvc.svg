<g fill="#f5f1e8" font-family="monospace" font-size="16" letter-spacing="3"><text x="560" y="58">VIEW</text><text x="940" y="345">CONTROLLER</text><text x="548" y="640">SERVICE</text><text x="80" y="345">REPOSITORY</text></g>
<text x="520" y="346" fill="#fff" font-family="sans-serif" font-size="23" font-weight="700">MODEL</text><text x="54" y="66" fill="#f5f1e8" font-family="monospace" font-size="18" letter-spacing="4">SPRING MVC / LAYER MAP</text><text x="54" y="620" fill="#91aff0" font-family="monospace" font-size="14" letter-spacing="2">REQUEST ↻ CONTROLLER ↻ SERVICE ↻ DATA</text>
</svg>