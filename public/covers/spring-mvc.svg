<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Spring MVC mathematical project artwork</title><desc id="desc">Concentric architecture rings connect view, controller, service and data layers.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08101d"/><stop offset="1" stop-color="#162b49"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#91afe0" stroke-opacity=".1"/></pattern></defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
<g transform="translate(600 337)" fill="none"><circle r="236" stroke="#f5f1e8" stroke-opacity=".18" stroke-width="2"/><circle r="175" stroke="#1768ff" stroke-opacity=".55" stroke-width="3"/><circle r="112" stroke="#f5f1e8" stroke-opacity=".4" stroke-width="3"/><circle r="48" fill="#1768ff" stroke="#f5f1e8" stroke-width="4"/><path d="M0-236V-48M0 48v188M-236 0h188M48 0h188M-167-167l133 133M34 34l133 133M167-167L34-34M-34 34l-133 133" stroke="#789bdd" stroke-opacity=".55"/>
